<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e8"><title>Project Tracker — The Creative Lab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--paper:#f4f0e8;--cream:#fbf8f2;--ink:#302a25;--muted:#8d8174;--line:#ded6ca;--rust:#a65f48;--sage:#87917b;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:0 28px}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand,.back{font:10px var(--mono);letter-spacing:.13em;color:var(--ink);text-decoration:none}.brand b{color:var(--rust);font-size:20px;margin-right:9px}.back{color:var(--rust)}header.hero{padding:48px 0 28px}.eyebrow{font:9px var(--mono);letter-spacing:.15em;color:var(--rust);margin:0 0 12px}h1{font:500 clamp(38px,6vw,58px)/1.05 var(--serif);letter-spacing:-.04em;margin:0 0 12px}h1 em{color:var(--rust)}.sub{color:var(--muted);font-size:13px;line-height:1.7;max-width:620px}.panel{background:var(--cream);border:1px solid #e6ded2;padding:20px;margin:16px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}label,.small{font:9px var(--mono);letter-spacing:.1em;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:#fffdf9;padding:11px 12px;color:var(--ink);outline:none;border-radius:2px}textarea{min-height:85px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--rust)}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff8ef;padding:10px 15px;font:9px var(--mono);letter-spacing:.1em}.btn.light{background:transparent;color:var(--ink);border-color:var(--line)}.btn.rust{background:var(--rust);border-color:var(--rust)}.list{display:grid;gap:10px;margin-top:15px}.item{background:#fffdf9;border:1px solid var(--line);padding:15px}.item h3{font:500 21px var(--serif);margin:0 0 5px}.muted{font-size:12px;color:var(--muted);line-height:1.6}.tag{font:8px var(--mono);letter-spacing:.1em;padding:5px 7px;background:#eee7dc;color:#786b5d}.bar{height:5px;background:#e8e0d5;margin:12px 0}.bar span{display:block;height:100%;background:var(--sage)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{padding:25px;text-align:center;color:var(--muted);font:11px var(--mono);background:#f5f0e7}.footer{padding:30px 0 40px;color:var(--muted);font:8px var(--mono);letter-spacing:.12em}@media(max-width:650px){.wrap{padding:0 17px}.grid{grid-template-columns:1fr}.panel{padding:15px}header.hero{padding:35px 0 20px}.top{height:60px}}
</style></head><body><div class="wrap"><nav class="top"><a class="brand" href="../"><b>✳</b> THE CREATIVE LAB</a><a class="back" href="../">← BACK TO LAB</a></nav><header class="hero"><p class="eyebrow">CREATIVE WORKSHOP / PROJECT TRACKER</p><h1>Project<br>Tracker<em>.</em></h1><p class="sub">A calm home for the projects you want to bring into the world.</p></header><section class="panel"><p class="eyebrow">NEW PROJECT</p><div class="grid"><div class="field"><label for="name">PROJECT NAME</label><input id="name" placeholder="e.g. A cinematic car story"></div><div class="field"><label for="category">CATEGORY</label><select id="category"><option>Photography</option><option>Video</option><option>Animation</option><option>Design</option><option>Language</option><option>Other</option></select></div></div><div class="field" style="margin-top:12px"><label for="description">DESCRIPTION</label><textarea id="description" placeholder="What are you making?"></textarea></div><div class="row" style="margin-top:12px"><button class="btn" id="add">ADD PROJECT +</button><span class="small" id="count">0 PROJECTS</span></div></section><section><div class="row" style="justify-content:space-between"><p class="eyebrow">YOUR PROJECTS</p><select id="filter" style="max-width:190px"><option value="all">All projects</option><option>Idea</option><option>In progress</option><option>On hold</option><option>Completed</option></select></div><div class="list" id="projects"></div></section><footer class="footer">THE CREATIVE LAB · YOUR IDEAS STAY IN THIS BROWSER</footer></div><script>const KEY='tcl_projects_v1';let projects=JSON.parse(localStorage.getItem(KEY)||'[]');const $=s=>document.querySelector(s);function save(){localStorage.setItem(KEY,JSON.stringify(projects));render()}function render(){let f=$('#filter').value;let data=projects.filter(p=>f==='all'||p.status===f);$('#count').textContent=projects.length+' PROJECTS';$('#projects').innerHTML=data.length?data.map(p=>'<article class="item"><div class="row" style="justify-content:space-between"><span class="tag">'+p.category+'</span><select data-status="'+p.id+'" style="max-width:145px;padding:7px"><option '+(p.status==='Idea'?'selected':'')+'>Idea</option><option '+(p.status==='In progress'?'selected':'')+'>In progress</option><option '+(p.status==='On hold'?'selected':'')+'>On hold</option><option '+(p.status==='Completed'?'selected':'')+'>Completed</option></select></div><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description||'No description yet.')+'</p><div class="row"><span class="small">'+p.tasks.filter(t=>t.done).length+'/'+p.tasks.length+' TASKS</span><span class="small">'+new Date(p.created).toLocaleDateString()+'</span></div><div class="bar"><span style="width:'+(p.tasks.length?100*p.tasks.filter(t=>t.done).length/p.tasks.length:0)+'%"></span></div><div class="row"><input data-task-input="'+p.id+'" placeholder="Add a task…" style="flex:1;min-width:130px"><button class="btn light" data-add-task="'+p.id+'">ADD TASK</button><button class="btn light" data-delete="'+p.id+'">DELETE</button></div>'+p.tasks.map((t,i)=>'<label style="display:flex;gap:8px;align-items:center;margin-top:9px;font:12px var(--sans);color:var(--ink)"><input type="checkbox" data-task="'+p.id+'" data-index="'+i+'" '+(t.done?'checked':'')+' style="width:auto">'+esc(t.text)+'</label>').join('')+'</article>').join(''):'<div class="empty">No projects here yet. Start with one small idea.</div>';document.querySelectorAll('[data-status]').forEach(e=>e.onchange=()=>{let p=projects.find(x=>x.id===e.dataset.status);p.status=e.value;save()});document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{projects=projects.filter(p=>p.id!==e.dataset.delete);save()});document.querySelectorAll('[data-add-task]').forEach(e=>e.onclick=()=>{let input=document.querySelector('[data-task-input="'+e.dataset.addTask+'"]');if(input.value.trim()){projects.find(p=>p.id===e.dataset.addTask).tasks.push({text:input.value.trim(),done:false});save()}});document.querySelectorAll('[data-task]').forEach(e=>e.onchange=()=>{projects.find(p=>p.id===e.dataset.task).tasks[+e.dataset.index].done=e.checked;save()})}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}$('#add').onclick=()=>{let name=$('#name').value.trim();if(!name)return;projects.unshift({id:crypto.randomUUID(),name,category:$('#category').value,description:$('#description').value.trim(),status:'Idea',created:Date.now(),tasks:[]});$('#name').value='';$('#description').value='';save()};$('#filter').onchange=render;render();</script></body></html>
