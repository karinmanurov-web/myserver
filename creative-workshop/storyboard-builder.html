<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e8"><title>Storyboard Builder — The Creative Lab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--paper:#f4f0e8;--cream:#fbf8f2;--ink:#302a25;--muted:#8d8174;--line:#ded6ca;--rust:#a65f48;--sage:#87917b;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:0 28px}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand,.back{font:10px var(--mono);letter-spacing:.13em;color:var(--ink);text-decoration:none}.brand b{color:var(--rust);font-size:20px;margin-right:9px}.back{color:var(--rust)}header.hero{padding:48px 0 28px}.eyebrow{font:9px var(--mono);letter-spacing:.15em;color:var(--rust);margin:0 0 12px}h1{font:500 clamp(38px,6vw,58px)/1.05 var(--serif);letter-spacing:-.04em;margin:0 0 12px}h1 em{color:var(--rust)}.sub{color:var(--muted);font-size:13px;line-height:1.7;max-width:620px}.panel{background:var(--cream);border:1px solid #e6ded2;padding:20px;margin:16px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}label,.small{font:9px var(--mono);letter-spacing:.1em;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:#fffdf9;padding:11px 12px;color:var(--ink);outline:none;border-radius:2px}textarea{min-height:85px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--rust)}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff8ef;padding:10px 15px;font:9px var(--mono);letter-spacing:.1em}.btn.light{background:transparent;color:var(--ink);border-color:var(--line)}.btn.rust{background:var(--rust);border-color:var(--rust)}.list{display:grid;gap:10px;margin-top:15px}.item{background:#fffdf9;border:1px solid var(--line);padding:15px}.item h3{font:500 21px var(--serif);margin:0 0 5px}.muted{font-size:12px;color:var(--muted);line-height:1.6}.tag{font:8px var(--mono);letter-spacing:.1em;padding:5px 7px;background:#eee7dc;color:#786b5d}.bar{height:5px;background:#e8e0d5;margin:12px 0}.bar span{display:block;height:100%;background:var(--sage)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{padding:25px;text-align:center;color:var(--muted);font:11px var(--mono);background:#f5f0e7}.footer{padding:30px 0 40px;color:var(--muted);font:8px var(--mono);letter-spacing:.12em}@media(max-width:650px){.wrap{padding:0 17px}.grid{grid-template-columns:1fr}.panel{padding:15px}header.hero{padding:35px 0 20px}.top{height:60px}}
</style></head><body><div class="wrap"><nav class="top"><a class="brand" href="../"><b>✳</b> THE CREATIVE LAB</a><a class="back" href="../">← BACK TO LAB</a></nav><header class="hero"><p class="eyebrow">CREATIVE WORKSHOP / STORYBOARD BUILDER</p><h1>Storyboard<br>Builder<em>.</em></h1><p class="sub">Arrange shots into a visual sequence, shape the rhythm and export a printable storyboard.</p></header><section class="panel"><p class="eyebrow">NEW FRAME</p><div class="grid"><div class="field"><label>SHOT / FRAME TITLE</label><input id="title" placeholder="01 — The opening"></div><div class="field"><label>CAMERA ANGLE</label><select id="angle"><option>Wide establishing</option><option>Medium shot</option><option>Close-up</option><option>Extreme close-up</option><option>Low angle</option><option>High angle</option><option>POV</option><option>Over the shoulder</option></select></div><div class="field"><label>CAMERA MOVEMENT</label><select id="move"><option>Static</option><option>Pan</option><option>Tilt</option><option>Dolly in</option><option>Dolly out</option><option>Tracking</option><option>Orbit</option><option>Handheld</option></select></div><div class="field"><label>DURATION (SEC)</label><input id="duration" type="number" min="1" max="120" value="3"></div></div><div class="field" style="margin-top:12px"><label>VISUAL DESCRIPTION</label><textarea id="desc" placeholder="What happens in this frame? Light, action, composition…"></textarea></div><div class="row" style="margin-top:12px"><button class="btn" id="add">ADD FRAME +</button><button class="btn light" id="export">EXPORT STORYBOARD</button></div></section><section><div class="row" style="justify-content:space-between"><p class="eyebrow">SEQUENCE</p><span class="small" id="summary">0 FRAMES · 0 SEC</span></div><div class="list" id="frames"></div></section><footer class="footer">THE CREATIVE LAB · YOUR IDEAS STAY IN THIS BROWSER</footer></div><script>const KEY='tcl_storyboard_v1';let frames=JSON.parse(localStorage.getItem(KEY)||'[]');const $=s=>document.querySelector(s);function save(){localStorage.setItem(KEY,JSON.stringify(frames));render()}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){$('#summary').textContent=frames.length+' FRAMES · '+frames.reduce((a,f)=>a+f.duration,0)+' SEC';$('#frames').innerHTML=frames.length?frames.map((f,i)=>'<article class="item" draggable="true" data-frame="'+i+'"><div class="row" style="justify-content:space-between"><span class="tag">FRAME '+String(i+1).padStart(2,'0')+'</span><span class="small">'+f.duration+' SEC</span></div><h3>'+esc(f.title)+'</h3><p class="muted">'+esc(f.desc||'No visual notes.')+'</p><div class="row"><span class="tag">'+esc(f.angle)+'</span><span class="tag">'+esc(f.move)+'</span></div><div class="actions"><button class="btn light" data-up="'+i+'" '+(i===0?'disabled':'')+'>↑</button><button class="btn light" data-down="'+i+'" '+(i===frames.length-1?'disabled':'')+'>↓</button><button class="btn light" data-del="'+i+'">REMOVE</button></div></article>').join(''):'<div class="empty">Your storyboard is waiting for its first frame.</div>';document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>swap(+b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>swap(+b.dataset.down,1));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{frames.splice(+b.dataset.del,1);save()});let drag=null;document.querySelectorAll('[data-frame]').forEach(el=>{el.ondragstart=()=>drag=+el.dataset.frame;el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let to=+el.dataset.frame;let item=frames.splice(drag,1)[0];frames.splice(to,0,item);save()}})}function swap(i,d){let j=i+d;[frames[i],frames[j]]=[frames[j],frames[i]];save()}$('#add').onclick=()=>{let title=$('#title').value.trim();if(!title)return;frames.push({title,angle:$('#angle').value,move:$('#move').value,duration:Math.max(1,Number($('#duration').value)||3),desc:$('#desc').value.trim()});$('#title').value='';$('#desc').value='';save()};$('#export').onclick=()=>{let w=window.open('','_blank');if(!w)return;w.document.write('<html><head><title>Storyboard</title><style>body{font:14px Arial;padding:30px;color:#302a25}h1{font:32px Georgia}article{border:1px solid #ddd;padding:16px;margin:12px 0;break-inside:avoid}small{color:#777}</style></head><body><h1>Creative Lab — Storyboard</h1>'+frames.map((f,i)=>'<article><small>FRAME '+(i+1)+' · '+f.duration+' SEC</small><h2>'+esc(f.title)+'</h2><p>'+esc(f.desc)+'</p><p>'+esc(f.angle)+' / '+esc(f.move)+'</p></article>').join('')+'</body></html>');w.document.close();w.print()};render();</script></body></html>
